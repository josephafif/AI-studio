<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Control Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><polygon class="ring" points="16,2 28.1,9 28.1,23 16,30 3.9,23 3.9,9" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle class="core" cx="16" cy="16" r="4" fill="var(--accent)"/><circle cx="16" cy="16" r="9" fill="none" stroke="var(--cyan)" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/></svg>
      <div><strong>AI Control Center</strong><span>Lokal modellverkstad</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-status" id="side-status"></div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="page-title"></h1>
      <div class="active-model">
        <label for="active-model">Aktiv modell</label>
        <select id="active-model"></select>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
