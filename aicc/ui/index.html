<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Control Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><circle cx="11" cy="11" r="2.4" fill="#fff"/><circle cx="21" cy="11" r="2.4" fill="#fff"/><circle cx="16" cy="21" r="2.4" fill="#fff"/><path d="M11 11L21 11L16 21Z" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
      <div><strong>AI Control Center</strong><span>Lokal modellverkstad</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-status" id="side-status"></div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="page-title"></h1>
      <div class="active-model">
        <label for="active-model">Aktiv modell</label>
        <select id="active-model"></select>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
