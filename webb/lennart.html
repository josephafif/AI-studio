<title>Lennart</title>
<meta name="description" content="Lennart i webbläsaren – samma app som på Windows, med modellen inläst från en .lennart-fil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap">
<style>
/* Samma utseende som Windows-versionen: sidopanel till vänster, samtalet i mitten, fältet nederst.
   Accentfärgen följer vald modell (modellens nyans). */
:root {
  --bg: #f3f6f9; --surface: #ffffff; --glass: rgba(255, 255, 255, 0.7); --stroke: rgba(11, 26, 42, 0.10);
  --text: #0d141c; --muted: #5b6675; --bubble: #e6ebf0; --green: #0e9f62; --danger: #d64545;
  --sida: rgba(255, 255, 255, 0.55); --skugga: 0 20px 60px rgba(13, 20, 28, 0.18);
  --h: 290; --acc: hsl(var(--h) 65% 42%); --acc2: hsl(calc(var(--h) + 40) 70% 45%); --glow: hsl(var(--h) 70% 50% / 0.16);
  --sans: "Roboto", "Segoe UI", system-ui, sans-serif;
  --serif: "Noto Serif", Georgia, Cambria, serif;
  --mono: "Roboto Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05070a; --surface: #0d1219; --glass: rgba(255, 255, 255, 0.08); --stroke: rgba(255, 255, 255, 0.12);
    --text: #e9eef5; --muted: #8b97a8; --bubble: #18202a; --green: #3ddc97; --danger: #ff6b6b;
    --sida: rgba(24, 20, 36, 0.55); --skugga: 0 24px 80px rgba(0, 0, 0, 0.55);
    --acc: hsl(var(--h) 85% 70%); --acc2: hsl(calc(var(--h) + 40) 85% 66%); --glow: hsl(var(--h) 90% 60% / 0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05070a; --surface: #0d1219; --glass: rgba(255, 255, 255, 0.08); --stroke: rgba(255, 255, 255, 0.12);
  --text: #e9eef5; --muted: #8b97a8; --bubble: #18202a; --green: #3ddc97; --danger: #ff6b6b;
  --sida: rgba(24, 20, 36, 0.55); --skugga: 0 24px 80px rgba(0, 0, 0, 0.55);
  --acc: hsl(var(--h) 85% 70%); --acc2: hsl(calc(var(--h) + 40) 85% 66%); --glow: hsl(var(--h) 90% 60% / 0.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

.app { display: flex; height: 100dvh; position: relative;
  background: radial-gradient(1200px 700px at 0% 0%, hsl(var(--h) 60% 40% / 0.16), transparent 60%),
              radial-gradient(1000px 800px at 100% 100%, hsl(190 70% 40% / 0.10), transparent 60%), var(--bg); }

/* Sidopanelen */
#sida { width: 356px; flex: none; display: flex; flex-direction: column; background: var(--sida); border-right: 1px solid var(--stroke);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 20; }
.logga { display: flex; align-items: center; gap: 14px; padding: 22px 22px 14px; font: 700 27px/1 var(--serif); letter-spacing: -0.02em; }
.mbadge { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font: 700 15px var(--mono); color: var(--text);
  background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(135deg, var(--acc), var(--acc2)) border-box;
  border: 2px solid transparent; box-shadow: 0 0 18px var(--glow); flex: none; }
.mbadge.liten { width: 26px; height: 26px; border-radius: 8px; font-size: 9.5px; letter-spacing: -0.04em; border-width: 1.5px; box-shadow: 0 0 10px var(--glow); }
.radknapp { display: flex; align-items: center; gap: 16px; width: 100%; padding: 12px 22px; text-align: left; border-radius: 12px; font-weight: 700; font-size: 18.5px; }
.radknapp:hover { background: var(--glass); }
.rubrik { font-weight: 700; font-size: 15.5px; color: var(--muted); padding: 22px 23px 10px; }
#lista { flex: 1; overflow: auto; padding: 0 8px; }
.tomlista { color: var(--muted); font-size: 14px; padding: 6px 15px; }
.samtal { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 12px; text-align: left; }
.samtal:hover, .samtal.aktiv { background: var(--glass); }
.samtal .t { flex: 1; min-width: 0; }
.samtal .t b { display: block; font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.samtal .t span { color: var(--muted); font-size: 13.5px; }
.samtal .ta { opacity: 0; color: var(--muted); padding: 6px; border-radius: 8px; }
.samtal:hover .ta, .samtal.aktiv .ta, .samtal .ta:focus-visible { opacity: 1; }
.samtal .ta:hover { color: var(--danger); }
.sidfot { padding: 14px 18px 18px; border-top: 1px solid transparent; }
.utseende { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; }
.utseende span { flex: 1; }
.utseende button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.utseende button[aria-pressed="true"] { background: var(--glass); color: var(--green); }
.utseende svg { width: 20px; height: 20px; }
.liten-text { color: var(--muted); font-size: 14px; margin-top: 14px; }

/* Huvudytan */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
#regn { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.topp { position: relative; display: flex; align-items: center; gap: 10px; padding: 14px 18px; min-height: 64px; z-index: 2; }
#titel { flex: 1; text-align: center; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
.ikon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.ikon:hover { background: var(--glass); }
#meny { display: none; }
#logg { position: relative; flex: 1; overflow-y: auto; z-index: 1; scroll-behavior: auto; }
.spalt { max-width: 1000px; margin: 0 auto; padding: 8px 32px 24px; }

.tomt { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 20px; }
.tomt canvas { width: min(440px, 70vw); aspect-ratio: 1; display: block; margin: 0 auto -10px; }
.tomt h1 { font: 500 clamp(28px, 4vw, 36px)/1.2 var(--serif); margin: 0 0 10px; }
.tomt p { color: var(--muted); max-width: 52ch; margin: 0 auto 16px; }
.knapp { display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 999px; font-weight: 700;
  background: var(--text); color: var(--bg); }
.knapp.ljus { background: var(--glass); color: var(--text); border: 1px solid var(--stroke); }
.knapp svg { width: 20px; height: 20px; }

.anv { display: flex; justify-content: flex-end; margin: 18px 0; }
.anv div { background: var(--bubble); padding: 12px 20px; border-radius: 24px; max-width: 78%; font-size: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.svar { margin: 14px 0 22px; }
.svar .text { font-size: 18px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.svar .text.fel { color: var(--danger); }
.markor::after { content: "▍"; color: var(--acc); animation: blink 1s steps(2) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
.meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 14.5px; }
.meta button { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.meta button:hover { background: var(--glass); color: var(--text); }
.meta svg { width: 19px; height: 19px; }
.osaker { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 12px; border-radius: 999px; font-size: 13.5px;
  color: #c98a1e; border: 1px solid rgba(201, 138, 30, 0.4); background: rgba(201, 138, 30, 0.08); }
.osaker svg { width: 16px; height: 16px; }

.tank { margin-bottom: 10px; }
.tankrad { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 17px; padding: 4px 6px 4px 0; border-radius: 8px; }
.tankrad:hover { color: var(--text); }
.stjarna { width: 22px; height: 22px; color: var(--acc); }
.tanker .stjarna { animation: snurra 2.4s linear infinite; }
@keyframes snurra { to { transform: rotate(360deg); } }
.tankrad .pil { width: 18px; height: 18px; transition: transform 0.2s; }
.tank.oppen .tankrad .pil { transform: rotate(90deg); }
.live { font: 400 15px var(--mono); color: var(--muted); opacity: 0.75; margin: 6px 0 0 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utkast { border-left: 2px solid var(--stroke); margin: 8px 0 6px 10px; padding: 2px 0 2px 22px; display: none; }
.tank.oppen .utkast { display: block; }
.utkast h4 { font: 700 14.5px var(--mono); color: var(--muted); margin: 12px 0 4px; }
.utkast h4.vald { color: var(--acc); }
.utkast h5 { font: 700 13px var(--sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 0; }
.utkast p { margin: 0; color: var(--muted); font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }

.anrop { margin: 14px 0 6px; }
.anrop .fore { font-size: 17px; margin-bottom: 6px; }
.anrop .rad { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 17px; min-width: 0; }
.anrop .rad b { color: var(--text); }
.anrop .rad code { font: 400 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.anrop svg { width: 18px; height: 18px; }
.kort { border: 1px solid var(--stroke); background: color-mix(in srgb, var(--bubble) 70%, transparent); border-radius: 14px; padding: 10px 16px 12px; margin: 8px 0; }
.kort.fel { border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.kort .h { display: flex; align-items: center; gap: 10px; font: 700 14px var(--mono); }
.kort .h svg { width: 18px; height: 18px; color: var(--green); }
.kort.fel .h svg { color: var(--danger); }
.kort pre { margin: 8px 0 0; font: 400 14.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.kort.fel pre { color: var(--danger); }

/* Fältet */
.nere { position: relative; z-index: 2; padding: 8px 32px 10px; }
.falt { max-width: 1000px; margin: 0 auto; border-radius: 28px; padding: 14px 14px 12px; background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--stroke); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: border-color 0.2s, box-shadow 0.2s; }
.falt:focus-within { border-color: color-mix(in srgb, var(--acc) 70%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--acc) 35%, transparent), 0 0 30px var(--glow); }
#in { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 19px/1.45 var(--sans);
  padding: 4px 12px 12px; max-height: 220px; caret-color: var(--acc); }
#in::placeholder { color: var(--muted); }
.knapprad { display: flex; align-items: center; gap: 10px; }
.rund { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--stroke); flex: none; }
.rund:hover { background: var(--glass); }
.rund.fylld { background: var(--text); color: var(--bg); border: 0; }
.rund.fylld:disabled { background: var(--stroke); color: var(--muted); cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 7px; border-radius: 16px; background: var(--glass); min-width: 0; }
.chip:hover { background: color-mix(in srgb, var(--glass) 70%, var(--stroke)); }
.chip b { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span.niva { color: var(--muted); font-size: 18px; }
.chip svg { width: 18px; height: 18px; color: var(--muted); }
.fyll { flex: 1; }
#status { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tips { text-align: center; color: var(--muted); font-size: 14px; padding-top: 10px; }

/* Dialoger och menyer */
.bak { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.bak[hidden] { display: none; }
.dialog { background: var(--surface); border: 1px solid var(--stroke); border-radius: 28px; box-shadow: var(--skugga); max-width: 1080px; width: 100%;
  max-height: calc(100dvh - 32px); overflow: auto; padding: 26px 26px 22px; }
.dialog.smal { max-width: 520px; }
.tva { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.tva > div + div { border-left: 1px solid var(--stroke); padding-left: 22px; }
.drubrik { font: 700 14px var(--sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
.val { display: flex; align-items: center; gap: 16px; width: 100%; padding: 10px 10px; border-radius: 14px; text-align: left; }
.val:hover { background: var(--glass); }
.val .t { flex: 1; min-width: 0; }
.val .t b { display: flex; align-items: center; gap: 8px; font-size: 19px; }
.val .t span { color: var(--muted); font-size: 15.5px; display: block; }
.val .bock { color: var(--green); visibility: hidden; }
.val[aria-checked="true"] .bock { visibility: visible; }
.nyast { font: 700 12px var(--sans); color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); padding: 2px 7px; border-radius: 6px; }
.staplar { display: inline-flex; align-items: flex-end; gap: 3px; width: 42px; height: 24px; justify-content: center; }
.staplar i { width: 5px; border-radius: 2px; background: var(--stroke); }
.staplar i.p { background: var(--green); }
.linje { height: 1px; background: var(--stroke); margin: 10px 0; }
.taBort { color: var(--muted); padding: 6px; border-radius: 8px; }
.taBort:hover { color: var(--danger); background: var(--glass); }
.dialog h2 { font: 500 26px/1.25 var(--sans); margin: 0 0 12px; }
.dialog p { color: var(--muted); margin: 0 0 12px; }
.dialog pre { font: 400 13.5px var(--mono); background: var(--bubble); padding: 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.dknappar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.dknappar button { padding: 10px 22px; border-radius: 999px; font-weight: 700; }
.dknappar .ja { background: var(--green); color: #03140c; }
.dknappar .nej { color: var(--green); }
.meny { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--stroke); border-radius: 20px; box-shadow: var(--skugga); padding: 8px; width: min(380px, calc(100vw - 24px)); }
.meny[hidden] { display: none; }
.vaxel { width: 46px; height: 26px; border-radius: 13px; background: var(--stroke); position: relative; flex: none; transition: background 0.2s; }
.vaxel::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.2s; }
[aria-checked="true"] > .vaxel { background: var(--green); }
[aria-checked="true"] > .vaxel::after { transform: translateX(20px); }
#notis { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px;
  font-size: 15px; z-index: 60; max-width: calc(100vw - 32px); box-shadow: var(--skugga); }
#notis[hidden] { display: none; }
#slapp { position: fixed; inset: 12px; border: 2px dashed var(--acc); border-radius: 28px; display: grid; place-items: center; font: 700 22px var(--sans);
  background: color-mix(in srgb, var(--bg) 80%, transparent); z-index: 70; }
#slapp[hidden] { display: none; }
#skugga { display: none; }

@media (max-width: 860px) {
  #sida { position: fixed; inset: 0 auto 0 0; width: min(330px, 86vw); transform: translateX(-102%); transition: transform 0.25s; background: var(--surface); }
  .app.sidaoppen #sida { transform: none; }
  .app.sidaoppen #skugga { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 15; }
  #meny { display: grid; }
  .spalt { padding: 8px 16px 20px; }
  .nere { padding: 6px 12px 8px; }
  .tips { display: none; }
  .tva { grid-template-columns: 1fr; }
  .tva > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--stroke); padding-top: 14px; margin-top: 10px; }
  .anv div, .svar .text { font-size: 17px; }
  #titel { font-size: 16px; }
  .chip b, .chip span.niva { font-size: 16px; }
  .dialog { padding: 20px 14px 16px; border-radius: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .tanker .stjarna, .markor::after { animation: none; }
}
</style>

        <button data-tema="auto" aria-label="Som systemet" title="Som systemet"><svg viewBox="0 0 24 24"><path d="M12 2 14.4 4.6 18 4l.6 3.6L22 9.5 20.4 12.9 22 16.3 18.6 18.2 18 22l-3.6-.6L12 24l-2.4-2.6L6 22l-.6-3.8L2 16.3l1.6-3.4L2 9.5l3.4-1.9L6 4l3.6.6L12 2Zm-2.2 13.3h4.4l.8 2.2h1.8L12.6 7h-1.2L7.2 17.5H9l.8-2.2Zm.6-1.6L12 9.2l1.6 4.5h-3.2Z"/></svg></button>
        <button data-tema="light" aria-label="Ljust" title="Ljust"><svg viewBox="0 0 24 24"><path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10ZM11 1h2v3h-2V1Zm0 19h2v3h-2v-3ZM3.5 4.9l1.4-1.4L7 5.6 5.6 7 3.5 4.9ZM17 18.4l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM4.9 20.5l-1.4-1.4L5.6 17 7 18.4l-2.1 2.1ZM18.4 7 17 5.6l2.1-2.1 1.4 1.4L18.4 7Z"/></svg></button>

      </div>

    </div>
  </aside>
  <div id="skugga"></div>
  <main>
    <canvas id="regn" aria-hidden="true"></canvas>
    <header class="topp">
      <button class="ikon" id="meny" aria-label="Visa samtalen"><svg viewBox="0 0 24 24"><path d="M3 18v-2h13v2H3Zm0-5v-2h18v2H3Zm0-5V6h18v2H3Z"/></svg></button>
      <div id="titel"></div>
      <button class="ikon" id="nytt2" aria-label="Nytt samtal" title="Nytt samtal"><svg viewBox="0 0 24 24"><path d="M5 21q-.8 0-1.4-.6T3 19V5q0-.8.6-1.4T5 3h8.9l-2 2H5v14h14v-6.9l2-2V19q0 .8-.6 1.4T19 21H5Zm4-6v-4.3l9.2-9.2q.3-.3.7-.4.4-.2.8-.2t.8.2q.4.1.7.4L22.4 3q.3.3.4.7.2.4.2.8t-.1.8q-.2.4-.5.7L13.3 15H9Zm2-2h1.4l5.8-5.8-.7-.7-.7-.7-5.8 5.8V13Z"/></svg></button>
    </header>
    <div id="logg" aria-live="polite"></div>

        <textarea id="in" rows="1" placeholder="Fråga Lennart" aria-label="Meddelande"></textarea>

let x = null;           // motorns exporter
let h = 0;              // inläst modell
let vocab = 0, ctx = 0;
let buf = 0, bufLen = 0, out = 0, outLen = 0;
const mem = () => x.memory.buffer;

const start = (async () => {
  const s = atob(WASM_BASE64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  const { instance } = await WebAssembly.instantiate(bytes, {});
  x = instance.exports;
  x._initialize();
})();
start.catch((e) => postMessage({ type: 'startfel', message: String((e && e.message) || e) }));

function allokera(n) {
  const p = x.malloc(n);
  if (!p) throw new Error('Webbläsaren har inte tillräckligt med minne för modellen');
  return p;
}

function tokens(t) {
  if (t.length > bufLen) {
    if (buf) x.free(buf);
    bufLen = Math.max(64, t.length);
    buf = allokera(4 * bufLen);
  }
  new Int32Array(mem(), buf, t.length).set(t);
}

/* Det Dart-delen använder (se _WasmMotor i arbetare.dart). Vyerna skapas på nytt vid varje anrop,
 * eftersom minnet kan växa och då byts den underliggande bufferten. */
self.lm = {
  pos: () => x.lm_pos(h),
  context: () => ctx,
  vocab: () => vocab,
  reset: () => x.lm_reset(h),
  rewind: (p) => x.lm_rewind(h, p),
  logits: () => new Float32Array(mem(), x.lm_logits(h), vocab),
  eval: (t) => { tokens(t); return x.lm_eval(h, buf, t.length); },
  evalAll: (t) => {
    tokens(t);
    const n = t.length * vocab;
    if (n > outLen) {
      if (out) x.free(out);
      outLen = n;
      out = allokera(4 * n);
    }
    return x.lm_eval_all(h, buf, t.length, out) === 0 ? new Float32Array(mem(), out, n).slice() : new Float32Array(0);
  },
};

/* .lennart: "LENPKG01" | uint32 längd | JSON {entry, tokenizer} | utfyllnad till 4096 | .lmod-data */
async function ladda(m) {
  await start;
  let lmod, meta;
  if (m.paket) {
    const b = m.paket;
    const head = new Uint8Array(await b.slice(0, 12).arrayBuffer());
    if (head.length < 12 || String.fromCharCode(...head.slice(0, 8)) !== 'LENPKG01') {
      throw new Error('Filen är inte ett Lennart-modellpaket (.lennart)');
    }
    const len = new DataView(head.buffer).getUint32(8, true);
    meta = JSON.parse(new TextDecoder().decode(await b.slice(12, 12 + len).arrayBuffer()));
    lmod = b.slice(Math.ceil((12 + len) / 4096) * 4096);
  } else {
    meta = { entry: m.entry, tokenizer: JSON.parse(m.tokText) };
    lmod = m.lmod;
  }
  if (h) { x.lm_free(h); h = 0; }
  const size = lmod.size;
  const p = allokera(size);
  const BIT = 8 << 20;
  for (let off = 0; off < size; off += BIT) {
    const del = new Uint8Array(await lmod.slice(off, Math.min(size, off + BIT)).arrayBuffer());
    new Uint8Array(mem(), p + off, del.length).set(del);
    postMessage({ type: 'progress', id: m.id, done: off + del.length, total: size });
  }
  const err = allokera(256), info = allokera(32);
  h = x.lm_load_mem(p, size, err, 256); // motorn tar över minnesblocket
  if (!h) {
    const fel = new TextDecoder().decode(new Uint8Array(mem(), err, 256)).replace(/\0[\s\S]*$/, '');
    x.free(err); x.free(info);
    throw new Error('Modellen kunde inte läsas: ' + fel);
  }
  x.lm_info(h, info);
  const i = new Int32Array(mem(), info, 7);
  vocab = i[0]; ctx = i[4];
  const d = { vocab, dModel: i[1], layers: i[2], heads: i[3], context: i[4], int8: i[5] === 1 };
  x.free(err); x.free(info);
  self.lennartKommando({ cmd: 'tokenizer', text: JSON.stringify(meta.tokenizer), id: -1 });
  postMessage({ type: 'loaded', id: m.id, entry: meta.entry, info: d });
}

/* Kommandona körs ett i taget, i den ordning de kommer. */
let kedja = Promise.resolve();
self.onmessage = (e) => {
  const m = e.data;
  kedja = kedja.then(async () => {
    try {
      await start;
      if (m.cmd === 'ladda') await ladda(m);

/* ───────────────────────────── tillstånd */
let pref = Object.assign({ modell: null, niva: 'medel', agent: true, tema: 'auto' }, lager.get('prefs', {}));

/* ───────────────────────────── modeller (sparas i webbläsarens IndexedDB) */
const idb = (() => {

async function lasPaketHuvud(f) {
  const head = new Uint8Array(await f.slice(0, 12).arrayBuffer());

async function importera(lista) {
  for (const f of lista) {
    try {
      const entry = await lasPaketHuvud(f);
      modeller.set(entry.id, { id: entry.id, entry, blob: f });

async function taBortModell(id) {
  const m = modeller.get(id); if (!m) return;
  if (!confirm(`Ta bort ${m.entry.name} från webbläsaren?`)) return;
  modeller.delete(id);

/* ───────────────────────────── motorn i en Web Worker */

  if (laddar && laddar.id === id) return laddar.p;
  const m = modeller.get(id);
  if (!m) throw new Error('Lägg till en modell först (en .lennart-fil).');

async function korVerktyg(a) {
  lagg({ anv: false, kind: 'anrop', namn: a.namn, argument: a.argument, fore: a.fore, text: a.fore });
  renderLogg(true);

function godkann(a) {
  return new Promise((ok) => {
    const d = $('#dialog'); d.className = 'dialog smal'; d.replaceChildren();
    d.append(E('h2', null, `Får Lennart använda ${VISAS[a.namn] || a.namn}?`), E('p', null, BESKRIV[a.namn] || ''), E('pre', null, JSON.stringify(a.argument, null, 2)));
    const rad = E('div', 'dknappar'), nej = E('button', 'nej', 'Neka'), ja = E('button', 'ja', 'Tillåt');
    rad.append(nej, ja); d.append(rad);
    const klar = (v) => { stangDialog(); ok(v); };
    nej.onclick = () => klar(false); ja.onclick = () => klar(true);
    visaDialog(() => klar(false)); ja.focus();
  });
}

function turer() {
  return aktiv.meddelanden.filter((m) => !m.fel && m.text && !m.kind && !m.generar).map((m) => [m.anv, m.text]);
}

async function generera() {
  const modell = aktivModell(); const e = modell.entry;
  const niva = NIVAER.find((n) => n.id === pref.niva) || NIVAER[1];
  await laddaModell(modell.id);
  const svar = lagg({ anv: false, text: '', drafts: [], niva: niva.id, generar: true, utkastNu: 0, antal: niva.drafts, mening: -1 });
  renderLogg(true);
  const t0 = performance.now();
  await new Promise((ok) => {
    const f = (d) => {
      switch (d.type) {
        case 'token': svar.text += d.text; break;
        case 'draft': {
          while (svar.drafts.length <= d.i) svar.drafts.push({ text: '' });
          const u = svar.drafts[d.i]; u.text += d.text; u.seg = d.seg == null ? -1 : d.seg;
          svar.utkastNu = d.i; svar.antal = d.n; svar.mening = u.seg; break;
        }
        case 'draftEnd': if (svar.drafts[d.i]) { svar.drafts[d.i].score = d.score; svar.drafts[d.i].pruned = d.pruned; } break;
        case 'segment': if (svar.drafts[d.i]) svar.drafts[d.i].picked = true; svar.text = (svar.text + d.text).replace(/^\s+/, ''); break;
        case 'chosen': svar.chosen = d.i; svar.text = d.text.trim(); break;
        case 'done': {
          lyssnare.delete(f); aktuellGen = null;
          svar.text = svar.text.trim() || '…'; svar.generar = false;
          if (svar.drafts.length) svar.sekunder = (performance.now() - t0) / 1000;
          svar.osaker = d.score != null && d.score < -0.5;
          svar.meta = `${e.name} · ${niva.namn.toLowerCase()} · ${d.tokens} tok · ${(d.seconds > 0 ? d.tokens / d.seconds : 0).toFixed(1)} tok/s`;
          ok(); break;
        }
        case 'genError': lyssnare.delete(f); aktuellGen = null; svar.text = d.message; svar.fel = true; svar.generar = false; ok(); break;
        default: return;
      }
      planeraRender();
    };
    lyssnare.add(f);
    aktuellGen = { svar, f, ok, niva, e };
    uppdateraKnapp();
    arb.postMessage({ cmd: 'generate', id: nastaId++, turns: turer(), temperature: e.temperature ?? 0.7, maxTokens: e.max_tokens ?? 200,
      topK: e.top_k ?? 40, drafts: niva.drafts, plus: niva.plus });
  });
}

/* Stoppa: motorn räknar utan avbrott, så tråden avslutas och startas om. Modellen läses in igen vid nästa fråga. */
function stoppa() {
  if (!aktuellGen) return;
  const { svar, f, ok, niva, e } = aktuellGen;
  aktuellGen = null; lyssnare.delete(f);
  if (arb) arb.terminate();
  arb = null; startaArbetare();
  if (!svar.text && svar.drafts.length) {
    const bast = svar.drafts.filter((d) => !d.pruned).sort((a, b) => (b.score ?? -9) - (a.score ?? -9))[0] || svar.drafts[svar.drafts.length - 1];
    svar.text = bast.text;
  }
  svar.text = svar.text.trim() || '…'; svar.generar = false;
  svar.meta = `${e.name} · ${niva.namn.toLowerCase()} · stoppad`;
  ok();
}

function igen() {
  if (upptagen || !aktiv) return;
  const m = aktiv.meddelanden;
  while (m.length && !(m[m.length - 1].anv && !m[m.length - 1].kind)) m.pop();
  const sista = m.pop();
  if (!sista) return;
  $('#in').value = sista.text; skicka();
}

/* ───────────────────────────── rendering */
let renderPlan = 0;
function planeraRender() { if (!renderPlan) renderPlan = requestAnimationFrame(() => { renderPlan = 0; renderLogg(); }); }
const naraBotten = () => { const l = $('#logg'); return l.scrollHeight - l.scrollTop - l.clientHeight < 140; };

function renderAllt(rulla) {
  const m = aktivModell();
  document.documentElement.style.setProperty('--h', m ? nyans(m.entry) : 290);
  $('#chipBadge').textContent = m ? bricka(m.entry) : '+';
  $('#loggaBadge').textContent = 'L';
  $('#chipNamn').textContent = m ? m.entry.name : 'Lägg till modell';
  $('#chipNiva').textContent = m ? (NIVAER.find((n) => n.id === pref.niva) || NIVAER[1]).namn : '';
  $('#in').placeholder = m ? `Fråga ${m.entry.name}` : 'Fråga Lennart';
  $('#titel').textContent = aktiv ? aktiv.titel : '';
  for (const b of document.querySelectorAll('[data-tema]')) b.setAttribute('aria-pressed', String(b.dataset.tema === pref.tema));
  if (pref.tema === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = pref.tema;
  renderLista(); renderLogg(rulla); uppdateraKnapp();
}

function renderLista() {
  const l = $('#lista'); l.replaceChildren();
  if (!samtal.length) { l.append(E('div', 'tomlista', 'Dina samtal sparas här, i webbläsaren.')); return; }
  for (const s of samtal) {
    const b = E('div', 'samtal' + (s === aktiv ? ' aktiv' : '')); b.tabIndex = 0; b.setAttribute('role', 'button');
    const t = E('div', 't'); t.append(E('b', null, s.titel), E('span', null, s.modell || ''));
    const ta = E('button', 'ta'); ta.innerHTML = IKON.ta; ta.setAttribute('aria-label', 'Ta bort samtalet');
    ta.onclick = (ev) => { ev.stopPropagation(); taBortSamtal(s); };
    b.append(t, ta);
    b.onclick = () => oppnaSamtal(s);
    b.onkeydown = (ev) => { if (ev.key === 'Enter') oppnaSamtal(s); };
    l.append(b);
  }
}

function renderLogg(rulla) {
  const l = $('#logg');
  const vidBotten = rulla || naraBotten();
  l.replaceChildren();
  if (!aktiv || !aktiv.meddelanden.length) { l.append(tomVy()); startaKlot(); return; }
  stoppaKlot();
  const spalt = E('div', 'spalt');
  const sistaSvar = aktiv.meddelanden.map((m, i) => (!m.anv && !m.kind ? i : -1)).filter((i) => i >= 0).pop();
  aktiv.meddelanden.forEach((m, i) => spalt.append(byggMeddelande(m, i === sistaSvar)));
  l.append(spalt);
  if (vidBotten) l.scrollTop = l.scrollHeight;
}

function byggMeddelande(m, sist) {
  if (m.kind === 'anrop') {
    const d = E('div', 'anrop');
    if (m.fore) d.append(E('div', 'fore', m.fore));
    const r = E('div', 'rad'); r.innerHTML = IKON.verktyg;
    r.append(E('span', null, 'Använder '), E('b', null, VISAS[m.namn] || m.namn), E('code', null, JSON.stringify(m.argument)));
    d.append(r); return d;
  }
  if (m.kind === 'resultat') {
    const k = E('div', 'kort' + (m.felRes ? ' fel' : '')), h = E('div', 'h');
    h.innerHTML = m.felRes ? IKON.fel : IKON.ok; h.append(E('span', null, VISAS[m.namn] || m.namn));
    k.append(h, E('pre', null, m.text)); return k;
  }
  if (m.anv) { const d = E('div', 'anv'); d.append(E('div', null, m.text)); return d; }
  const d = E('div', 'svar');
  if (m.drafts && (m.drafts.length || (m.generar && m.niva !== 'snabb'))) d.append(byggTank(m));
  const visaText = m.text || (m.generar && m.niva === 'snabb');
  if (visaText) {
    const t = E('div', 'text' + (m.fel ? ' fel' : '') + (m.generar && (m.niva === 'snabb' || m.niva === 'djupPlus') ? ' markor' : ''), m.text);
    d.append(t);
  }
  if (m.osaker) { const o = E('div', 'osaker'); o.innerHTML = IKON.info; o.append(E('span', null, 'Osäker – dubbelkolla gärna')); d.append(o); }
  if (!m.generar && (m.meta || m.text)) {
    const meta = E('div', 'meta');
    const kop = E('button'); kop.innerHTML = IKON.kopiera; kop.setAttribute('aria-label', 'Kopiera svaret'); kop.title = 'Kopiera';
    kop.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(m.text) : Promise.reject()).then(() => notis('Kopierat'), () => notis('Kunde inte kopiera')); };
    meta.append(kop);
    if (sist && !m.kind) { const ig = E('button'); ig.innerHTML = IKON.igen; ig.setAttribute('aria-label', 'Svara igen'); ig.title = 'Svara igen'; ig.onclick = igen; meta.append(ig); }
    if (m.meta) meta.append(E('span', null, m.meta));
    d.append(meta);
  }
  return d;
}

function byggTank(m) {
  const t = E('div', 'tank' + (m.generar ? ' tanker' : '') + (m.oppen ? ' oppen' : ''));
  const rad = E('button', 'tankrad'); rad.innerHTML = IKON.stjarna;
  let rubrik;
  if (m.generar) rubrik = m.niva === 'djupPlus' ? `Tänker · mening ${Math.max(1, m.mening + 1)} · utkast ${m.utkastNu + 1} av ${m.antal}` : `Tänker · utkast ${m.utkastNu + 1} av ${m.antal}`;
  else rubrik = `Tänkte i ${(m.sekunder || 0).toFixed(1).replace('.', ',')} s · ${m.drafts.length} utkast`;
  rad.append(E('span', null, rubrik)); rad.insertAdjacentHTML('beforeend', IKON.pil);
  rad.setAttribute('aria-expanded', String(!!m.oppen));
  rad.onclick = () => { m.oppen = !m.oppen; renderLogg(); };
  t.append(rad);
  if (m.generar && !m.oppen) {
    const nu = m.drafts[m.utkastNu];
    const rad = nu ? nu.text.replace(/\s+/g, ' ').trim() : '';
    const live = E('div', 'live', rad.length > 90 ? '…' + rad.slice(-90) : rad);
    t.append(live);
  }
  const lista = E('div', 'utkast');
  let seg = -2;
  m.drafts.forEach((u, i) => {
    if (m.niva === 'djupPlus' && u.seg !== seg) { seg = u.seg; lista.append(E('h5', null, `Mening ${seg + 1}`)); }
    const vald = m.niva === 'djupPlus' ? u.picked : m.chosen === i;
    let h = `Utkast ${i + 1}`;
    if (u.pruned) h += ' · sållat tidigt';
    else if (vald) h += ' · valt';
    if (!u.pruned && u.score != null) h += `  (${u.score.toFixed(2)})`;
    lista.append(E('h4', vald ? 'vald' : null, h), E('p', null, u.text.trim()));
  });
  t.append(lista);
  return t;
}

  b.disabled = upptagen || !$('#in').value.trim();
}

/* ───────────────────────────── ASCII-klotet och regnet */
const stilla = matchMedia('(prefers-reduced-motion: reduce)').matches;
const farg = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let klotRaf = 0;
function stoppaKlot() { cancelAnimationFrame(klotRaf); klotRaf = 0; }
function startaKlot() {
  stoppaKlot();
  const cv = document.getElementById('klot'); if (!cv) return;
  const ctx = cv.getContext('2d'), N = 52, ramp = ' .:-=+*#%@';
  let ang = 0.6, forra = performance.now();
  const rita = (nu) => {
    if (!document.getElementById('klot')) return;
    const dt = Math.min(0.1, (nu - forra) / 1000); forra = nu; ang += dt * 0.3;
    const W = cv.width, cw = W / N, R = 0.62, acc = farg('--acc'), text = farg('--text'), muted = farg('--muted');
    const ljus = getComputedStyle(document.body).colorScheme === 'light' || farg('--bg').toLowerCase() === '#f3f6f9';
    ctx.clearRect(0, 0, W, W);
    const g = ctx.createRadialGradient(W / 2, W / 2, 0, W / 2, W / 2, W * 0.5); g.addColorStop(0, farg('--glow')); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
    ctx.font = `700 ${Math.round(cw * 1.02)}px ${farg('--mono')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(0.41), st = Math.sin(0.41);
    const L = [-0.62, 0.55, 0.56], ll = Math.hypot(...L), lx = L[0] / ll, ly = L[1] / ll, lz = L[2] / ll;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = ((i + 0.5) / N * 2 - 1) / R, y = -((j + 0.5) / N * 2 - 1) / R, r2 = x * x + y * y;
      if (r2 > 1) continue;
